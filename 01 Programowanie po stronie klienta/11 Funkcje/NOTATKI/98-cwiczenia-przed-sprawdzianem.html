        // zad 13
        function sredniaLiczb(...liczby) {
            let prawidlowe = [];

            for (const liczba of liczby) {
                if (!isNaN(liczba) && typeof(liczba) === "number") {
                    prawidlowe.push(liczba);
                } else {
                    continue;
                }
            }

            return prawidlowe.reduce((acc, cur) => acc + cur, 0);
        }

        document.write(sredniaLiczb(1, 2, 3, 4, NaN, true, 5));
