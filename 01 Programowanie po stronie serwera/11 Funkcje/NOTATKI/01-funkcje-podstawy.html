<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FUNKCJE - podstawy</title>
    <script>
        // Po co są funkcje?
        // Co to są funkcje?

        // - zbiór instrukcji ukrytych/zamknietych pod jedną nazwą
        // - funkcja może pobierać argumenty i zwracać !jedną! wartość
        // - można użyć potrzebnej funkcji, nie trzeba znać jej budowy

        // Tworzenie funkcji.

        /*

        Definicja funkcji: 

        function nazwa_funkcji(ewentualne parametru, ..., ...){
        zbiór
        instrukcji
        ...
        
        /może zwracać wartość/
        return zwracana_wartość;
        }

        */


        // 1) bezparametrowa i bez zwracania wartości

        // definicja funkcji 
        function przedstawSie(){
            document.write('<hr>');
            document.write('Imię i nazwisko ');
            document.write('uczeń klasy ... ');
            document.write('<hr>');
        }

        // żeby funkcja zaczęła działać trzeba ją wywołać
        przedstawSie();


        // jaki typ danych ma funkcja?
        document.write('Typ danych funkcji przedstawSie: ' + typeof(przedstawSie)); // typ 'function'

        // inny sposób tworzenia funkcji:

        // 2) z parametrem i bez zwracania wartości

        const przedstawSie2 = function(imie, nazwisko, klasa){
            document.write('<hr>');
            document.write(imie + ' ' + nazwisko + '<br>');
            document.write('uczeń klasy ' + klasa + '<br>');
            document.write('<hr>');
        }

        przedstawSie2('Jan', 'Nowak', '4F');


        // ćw.1 Napisz funkcję o nazwie prostokat(a,b),
        // która oblicza i prezentuje pole i obwód prostokąta 
        // z wartości boków podanych do parametrów:
        /*
        Treść komunikatu:

        "Prostokąt o wymiarach a=?, b=? ma pole ? oraz obwód ?."
        */

        function prostokat(a, b) {
            if (typeof(a) != "number" || typeof(b) != "number" || a <= 0 || b <= 0) {
                document.write('Wprowadzono błędne dane');
                document.write('<hr>');
                return;
            }

            let pole = a*b;
            let obwod = (2*a) + (2*b);


            document.write(`Prostokąt o wymiarach a=${a}, b=${b} ma pole ${pole} oraz obwód ${obwod}. <br>`);
            document.write('<hr>');
        }

        prostokat(-1, 5);


        function prostopadloscian(a, b, c) {
            if (typeof(a) != "number" || typeof(b) != "number" || a <= 0 || b <= 0 || c <= 0) {
                document.write('Wprowadzono błędne dane');
                document.write('<hr>');
                return;
            }

            let polecalkowite = (2*a*b) + (2*b*c) + (2*a*c);
            let obwod = 4 * (a+b+c);
            let objetosc = (a*b*c);
            

            document.write(`Prostopadłościan o wymiarach a=${a}, b=${b}, c=${c} ma pole całkowite ${polecalkowite}, obwód ${obwod} oraz objetosc ${objetosc}.`);
            document.write('<hr>');
        }

        prostopadloscian(5, 5, 5);

        // PRACA DOMOWA

        /*
        ćw. 2
        To samo tylko dla koła.
        "Koło o promieniu r=? ma pole ? oraz obwód ?."
        */

        function kolo(r) {
            if (typeof(r) != "number" || r <= 0) {
                document.write('Wprowadzono błędne dane');
                document.write('<hr>');
                return;
            }

            let pole = Math.PI * (r ** 2);
            let obwod = 2 * Math.PI * r;

            document.write(`Koło o promieniu r=${r} ma pole ${pole} oraz obwód ${obwod}.`);
            document.write('<hr>');
        } 

        kolo(5);


        // 3) z parametrami i ze zwracaniem wartości

        function poleKola(r) {
            const pole = Math.PI * (r ** 2);
            return pole;
            // tu moze byc tylko jeden return
            // return oznacza zwroc wartosc i zakoncz funkcje
            // czasem return sluzy tylko do konczenia funkcji
        }

        let pole = poleKola(10);
        let kula = 4/3 * pole * 10;
        let walec = pole * 15;  // pole * H

        document.write(`Pole koła wynosi: ${pole.toFixed(2)}, objętość kuli wynosi: ${kula.toFixed(2)}, objętość walca wynosi: ${walec.toFixed(2)} <hr>`);


        // ZADANIE
        // funkcja zwraca tablicę w wartościami pole i obwodu koła

        function kolo3(r){
        const pole = Math.PI * Math.pow(r, 2);
        const obwod = 2 * Math.PI * r;
        let tab = []; // odpowiedzi umieścimy w tablicy
        tab[0] = pole;
        tab[1] = obwod;
        tab[2] = r;
        return tab;
        }

        const tabOdpoKolo = kolo3(10);
        console.log(tabOdpoKolo);
        console.log(`Iloe elementów ma tabOdpKolo: ${tabOdpoKolo.length}`);
        
        document.write(`Kolo o promieniu r=${tabOdpoKolo[2]} ma pole ${tabOdpoKolo[0].toFixed(2)} i obwód ${tabOdpoKolo[1].toFixed(2)}. <hr>`);



        function kolo4(r) {
            const pole = Math.PI * Math.pow(r, 2);
            const obwod = 2 * Math.PI * r;
            
            const obj = {
                pole: pole,
                obwod: obwod,
                r: r
            }

            return obj;
        }

        const odjOdp = kolo4(10);
        console.log(odjOdp);
        document.write(`Kolo o promieniu r=${odjOdp.r} ma pole ${odjOdp.pole.toFixed(2)} i obwód ${odjOdp.obwod.toFixed(2)}. <hr>`);



        // Ćw.1 (return)
        //Napisz funkcję, która przyjmuje współrzędne punktów A i B 
        // (x1,y1,x2,y2) 
        //oraz zwraca odległość tych punktów.
        // (google -> odległość dwóch punktów -> )

        function odleglosc(A, B) {
            return Math.sqrt(((B.x - A.x) ** 2) + ((B.y - A.y) ** 2)).toFixed(2);
        }

        document.write(`Punkt A(2, 3) i punkt B(6, 6) są w odległości ${odleglosc({x: 2, y: 3}, {x: 6, y: 6})} <hr>`);     // 5



        // Ćw.2 (return)
        // Napisz funkcję, która oblicza pole i obwód pierścienia i zwraca te wartości
        // w postaci tablicy. Wywołaj funkcję wyświetl dane w ładnych komunikacie.

        function pierscien(R, r) {
            return [
                (Math.PI * (R**2 - r**2)),
                (2 * Math.PI * (R + r))
            ];
        }

        let R = 10;
        let r = 5;

        document.write(`Pole pierścienia o R = ${R} oraz r = ${r} wynosi ${pierscien(R, r)[0].toFixed(2)}, a jego obwód wynosi ${pierscien(R, r)[1].toFixed(2)}`);
    </script>
